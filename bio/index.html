<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bio Studio Zazelis</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Studio Zazelis Design — Landing v2 (rascunho de alinhamento, dobra 1)
   Tokens de marca herdados de assets/css/main.css (cromado/creme/verde-sinal,
   Bebas Neue + DM Sans). O que muda aqui e a composicao: fundo padrao da
   pagina passa a ser claro — o hero fica escuro de proposito, como abertura
   cinematografica, nao porque o site inteiro e escuro.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --dark:        #1B1B1B;
  --dark2:       #141414;
  --dark3:       #101010;
  --hero-1:      #161616;
  --hero-2:      #282828;
  --cream:       #FFFBE9;
  --chrome:      #c8c8c8;
  --chrome-dark: #8a8a8a;
  /* Acento cromado — parte da idv (mesma familia do simbolo metalico), com
     duas leituras: clara para fundo escuro, escura para fundo claro — como
     o proprio metal muda de tom conforme a luz. */
  --accent:      #E4E4EA;
  --accent-ink:  #5B5B63;
  --line:        rgba(255, 251, 233, 0.09);
  --line-strong: rgba(255, 251, 233, 0.18);
  --text-muted:  rgba(255, 251, 233, 0.62);
  --text-faint:  rgba(255, 251, 233, 0.5);

  --bg:          #ffffff;
  --surface:     #F6F4EF;
  --ink:         #161616;
  --ink-muted:   rgba(22, 22, 22, 0.64);
  --ink-faint:   rgba(22, 22, 22, 0.46);
  --line-ink:    rgba(22, 22, 22, 0.1);
  --line-ink-strong: rgba(22, 22, 22, 0.18);
  /* Titulos e subtitulos sobre fundo claro. */
  --title: #161616;

  /* Plus Jakarta Sans para titulos (tracking negativo, como a referencia),
     Inter para texto corrido — troca do par Bebas Neue + DM Sans. */
  --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  --gutter:    clamp(1.25rem, 5vw, 2.5rem);
  --maxw:      1240px;
  --section-y: clamp(4rem, 9vw, 7.5rem);

  /* Mesma gramatica de movimento do site atual: uma curva unica para tudo. */
  --ease:     cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --t-micro:  0.24s;
  --t-ui:     0.4s;
  --t-enter:  0.9s;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
  overflow-x: clip;
  /* Sem isso, um link do menu rola o titulo-alvo pro topo exato da tela,
     onde a pilula fixa do header cobre ele — parece que foi pro lugar
     errado. O respiro extra (alem da altura da pilula) evita que o titulo
     fique colado na borda de baixo do header. */
  scroll-padding-top: 116px;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 300;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
body.menu-open { overflow: hidden; }

img { max-width: 100%; display: block; }
a { color: inherit; }
.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }

:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }
:focus:not(:focus-visible) { outline: none; }
/* Sobre fundo escuro (hero, cards escuros) o foco precisa ser claro. */
.hero :focus-visible,
[data-theme="dark"] :focus-visible { outline-color: var(--cream); }

/* ==========================================================================
   CURSOR — ponto preciso + contorno em losango com atraso elastico.
   O poligono e uma leitura minimalista do simbolo da marca. Troca de cor
   conforme a secao esteja sobre fundo claro ou escuro (.cursor-on-dark,
   escrita por JS a partir de [data-theme] — ver landing-v2.js).
   Some sozinho fora de ponteiro fino, com media (hover:hover)/(pointer:fine)
   no proprio JS, e respeita prefers-reduced-motion.
   ========================================================================== */
.cursor-dot,
.cursor-poly {
  position: fixed; top: 0; left: 0; z-index: 999;
  pointer-events: none; opacity: 0; will-change: transform;
  transition: opacity var(--t-ui) var(--ease);
}
.cursor-ready .cursor-dot,
.cursor-ready .cursor-poly { opacity: 1; }

.cursor-dot {
  width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%;
  background: var(--ink);
  transform: translate3d(var(--dot-x, 0), var(--dot-y, 0), 0) scale(var(--dot-s, 1));
  transition: opacity var(--t-ui) var(--ease), background-color var(--t-micro) var(--ease);
}
.cursor-on-dark .cursor-dot { background: var(--cream); }

.cursor-poly {
  width: 34px; height: 52px; margin: -26px 0 0 -17px;
  transform: translate3d(var(--poly-x, 0), var(--poly-y, 0), 0)
             scale(var(--poly-s, 1)) rotate(var(--poly-r, 0deg));
  transition: opacity var(--t-ui) var(--ease);
}
.cursor-poly svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cursor-poly polygon {
  fill: none; stroke: var(--ink); stroke-width: 1.4; opacity: 0.75;
  transition: stroke var(--t-micro) var(--ease), opacity var(--t-micro) var(--ease);
  vector-effect: non-scaling-stroke;
}
.cursor-on-dark .cursor-poly polygon { stroke: var(--cream); }

.cursor-label {
  position: absolute; left: 50%; top: 100%;
  transform: translate(-50%, 10px) scale(0.9);
  padding: 0.34rem 0.62rem; border-radius: 999px;
  background: var(--ink); color: var(--bg);
  font-family: var(--font-body); font-weight: 600;
  font-size: 0.66rem; letter-spacing: 0.1em; line-height: 1; white-space: nowrap;
  opacity: 0; transition: opacity var(--t-micro) var(--ease), transform var(--t-micro) var(--ease);
}
.cursor-on-dark .cursor-label { background: var(--cream); color: var(--dark); }
.cursor-poly[data-state="cta"] .cursor-label,
.cursor-poly[data-state="case"] .cursor-label { opacity: 1; transform: translate(-50%, 10px) scale(1); }

.cursor-poly[data-state="link"] polygon  { opacity: 0.8; }
.cursor-poly[data-state="cta"] polygon   { stroke: var(--accent-ink); opacity: 1; }
.cursor-on-dark .cursor-poly[data-state="cta"] polygon { stroke: var(--accent); }
.cursor-poly[data-state="case"] polygon  { opacity: 0.9; }
.cursor-poly[data-state="media"] polygon { opacity: 0.28; }
.cursor-ready .cursor-poly[data-state="quiet"] { opacity: 0.35; }

body.cursor-ready, .cursor-ready a, .cursor-ready button { cursor: none; }

/* So desliga em toque/sem hover — largura da janela nao decide mais isto.
   Um painel de artifact ou uma janela mais estreita ainda tem mouse. */
@media (hover: none), (pointer: coarse) {
  .cursor-dot, .cursor-poly { display: none !important; }
  body.cursor-ready, .cursor-ready a, .cursor-ready button { cursor: auto; }
}

.skip-link {
  position: absolute; top: -100px; left: var(--gutter); z-index: 400;
  padding: 0.75rem 1.25rem; background: var(--cream); color: var(--dark);
  font-weight: 500; font-size: 0.9rem; border-radius: 8px;
}
.skip-link:focus { top: 12px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ==========================================================================
   HEADER — pilula flutuante (antes: barra full-width). Fica por cima do
   hero escuro; quando existirem mais dobras claras, o blur/escurecimento
   extra em .is-scrolled garante contraste do texto creme em qualquer fundo.
   ========================================================================== */
.header {
  position: fixed; top: clamp(0.85rem, 2.5vw, 1.5rem); left: 0; right: 0; z-index: 200;
  display: flex; justify-content: center;
  padding-inline: var(--gutter);
  pointer-events: none;
}
.header-inner {
  pointer-events: auto;
  display: flex; align-items: center; gap: 1rem;
  width: 100%; max-width: calc(var(--maxw) + 1rem);
  padding: 0.55rem 0.6rem 0.55rem 1.3rem;
  border-radius: 999px;
  background: rgba(22, 22, 22, 0.56);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(18px) saturate(1.15);
  -webkit-backdrop-filter: blur(18px) saturate(1.15);
  transition: background var(--t-ui) var(--ease), border-color var(--t-ui) var(--ease), box-shadow var(--t-ui) var(--ease);
}
.header.is-scrolled .header-inner {
  background: rgba(16, 16, 16, 0.85);
  border-color: rgba(255, 255, 255, 0.12);
  box-shadow: 0 12px 32px -14px rgba(0, 0, 0, 0.55);
}

.brand { display: flex; align-items: center; margin-right: auto; text-decoration: none; }
.brand img { height: 28px; width: auto; }

.header-inner .nav { display: none; align-items: center; gap: 2.1rem; margin-inline: auto; }
.nav a {
  font-family: var(--font-body); font-size: 0.87rem; font-weight: 500;
  color: rgba(255, 251, 233, 0.72); text-decoration: none;
  transition: color var(--t-micro) var(--ease);
}
.nav a:hover { color: var(--cream); }

.header-inner .header-cta { display: none; }

.burger {
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  gap: 5px; width: 42px; height: 42px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.06); border: none; cursor: pointer; flex: none;
}
.burger span {
  display: block; width: 18px; height: 1.5px; background: var(--cream);
  transition: transform var(--t-ui) var(--ease), opacity var(--t-ui) var(--ease);
}
.burger[aria-expanded="true"] span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.burger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

.mobile-menu {
  position: fixed; inset: 0; z-index: 190;
  background: var(--dark2);
  display: flex; flex-direction: column; justify-content: center;
  padding: 6rem var(--gutter) 3rem;
  clip-path: inset(0 0 100% 0);
  visibility: hidden;
  transition: clip-path 0.6s var(--ease-out), visibility 0s linear 0.6s;
}
.mobile-menu[data-open="true"] {
  clip-path: inset(0 0 0 0);
  visibility: visible;
  transition: clip-path 0.6s var(--ease-out), visibility 0s;
}
.mobile-menu a {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(1.7rem, 8vw, 2.3rem);
  letter-spacing: -0.03em; text-decoration: none; padding-block: 0.6rem;
  border-bottom: 1px solid var(--line); color: var(--text-muted);
  opacity: 0; transform: translateY(14px);
  transition: opacity var(--t-ui) var(--ease), transform var(--t-ui) var(--ease), color var(--t-micro) var(--ease);
}
.mobile-menu[data-open="true"] a { opacity: 1; transform: none; }
.mobile-menu a:nth-child(1) { transition-delay: .12s; }
.mobile-menu a:nth-child(2) { transition-delay: .18s; }
.mobile-menu a:nth-child(3) { transition-delay: .24s; }
.mobile-menu a:nth-child(4) { transition-delay: .30s; }
.mobile-menu a:hover { color: var(--cream); }
.mobile-menu .btn {
  margin-top: 2rem; align-self: flex-start;
  opacity: 0; transform: translateY(14px);
  transition: opacity var(--t-ui) var(--ease), transform var(--t-ui) var(--ease);
  transition-delay: .38s;
}
.mobile-menu[data-open="true"] .btn { opacity: 1; transform: none; }

@media (min-width: 1024px) {
  .header-inner .nav { display: flex; }
  .header-inner .header-cta { display: inline-flex; }
  .burger { display: none; }
}

/* ==========================================================================
   BOTOES — pilula (antes: retangulo levemente arredondado)
   ========================================================================== */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem;
  font-family: var(--font-body); font-weight: 500; font-size: 0.92rem;
  padding: 1rem 1.6rem; border-radius: 999px;
  border: 1px solid transparent; text-decoration: none; min-height: 50px;
  overflow: hidden; cursor: pointer;
  transition: color var(--t-ui) var(--ease), border-color var(--t-ui) var(--ease),
              transform var(--t-ui) var(--ease), background var(--t-ui) var(--ease);
}
.btn svg { width: 17px; height: 17px; flex: none; }
.btn-sm { padding: 0.68rem 1.2rem; min-height: 42px; font-size: 0.84rem; }

.btn-signal { background: var(--accent); color: var(--dark); }
.btn-signal:hover { transform: translateY(-2px); filter: brightness(1.06); }

.btn-primary { background: var(--cream); color: var(--dark); }
.btn-primary:hover { transform: translateY(-2px); background: #fff; }

/* Padrao pensado para fundo claro (a maioria das secoes agora); em contexto
   escuro (hero, cards escuros) o texto/borda clareiam via [data-theme]. */
.btn-ghost { border-color: var(--line-ink-strong); color: var(--ink); background: rgba(22, 22, 22, 0.02); }
.btn-ghost:hover { border-color: var(--ink); transform: translateY(-2px); background: rgba(22, 22, 22, 0.05); }
[data-theme="dark"] .btn-ghost { border-color: rgba(255, 251, 233, 0.24); color: var(--cream); background: rgba(255, 255, 255, 0.03); }
[data-theme="dark"] .btn-ghost:hover { border-color: var(--cream); background: rgba(255, 255, 255, 0.07); }

/* Preenchimento escuro solido — para CTAs sobre fundo claro/surface que
   precisam de mais peso visual que o btn-primary (creme) oferece. */
.btn-dark { background: #161616; color: var(--cream); }
.btn-dark:hover { transform: translateY(-2px); background: #000; }

/* ==========================================================================
   HERO — dobra 1. Fundo: shader WebGL animado (ruido simplex) entre
   #161616 e #282828. Gradiente CSS por baixo funciona como fallback
   instantaneo (antes do JS montar, sem WebGL, ou com movimento reduzido).
   ========================================================================== */
.hero {
  position: relative;
  min-height: 100svh;
  display: flex; flex-direction: column;
  overflow: hidden;
  background: linear-gradient(160deg, var(--hero-1), var(--hero-2));
  isolation: isolate;
}

.hero-bg { position: absolute; inset: 0; z-index: 0; }
.hero-bg canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; filter: blur(16px);
  will-change: opacity, filter;
  transition: opacity 1.5s var(--ease-out), filter 1.5s var(--ease-out);
}
.hero-bg canvas.is-ready { opacity: 1; filter: blur(0); }
.hero-bg::after {
  /* Vinheta extra: garante leitura do texto sobre o ruido, independente
     de onde o shader estiver mais claro no momento. */
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 55% at 50% 36%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.2) 100%),
    linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0) 28%, rgba(0, 0, 0, 0) 64%, rgba(0, 0, 0, 0.34) 100%);
  pointer-events: none;
}

.hero-content {
  position: relative; z-index: 1; flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  /* clamp em vh: em telas baixas (laptop ~700-800px) comprime sozinho para
     o CTA nunca ficar cortado; em telas altas, respira mais. */
  padding: clamp(5.5rem, 12vh + 2.5rem, 7.5rem) var(--gutter) clamp(1.5rem, 4vh, 2.5rem);
}

.hero-mark {
  height: 40px; width: auto; margin-bottom: 1rem;
  filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.55));
  animation: markFloat 5s ease-in-out infinite;
}
@keyframes markFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

.eyebrow-pill {
  display: inline-flex; align-items: center; gap: 0.55rem;
  padding: 0.5rem 1.05rem 0.5rem 0.75rem;
  border-radius: 999px; border: 1px solid rgba(255, 251, 233, 0.16);
  background: rgba(255, 255, 255, 0.04);
  font-family: var(--font-body); font-size: 0.75rem; font-weight: 500;
  letter-spacing: 0.13em; text-transform: uppercase; color: rgba(255, 251, 233, 0.78);
  margin-bottom: 1.15rem;
}
.eyebrow-pill .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none;
  animation: pulse 2.4s ease infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(228, 228, 234, .5); }
  50%      { opacity: .7; box-shadow: 0 0 0 6px rgba(228, 228, 234, 0); }
}

.hero h1 {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(2.35rem, 5.6vw, 4.5rem);
  line-height: 1.08; letter-spacing: -0.025em;
  color: var(--cream);
  /* Quebra da linha 1 vem do <br> no markup, nao de max-width — o texto
     tem dois pesos de linha desiguais de proposito, nao dá pra "balancear". */
  max-width: 34ch;
  text-wrap: balance;
}
.hero h1 em { font-style: normal; color: var(--accent); }

.hero-lede {
  margin-top: 1.2rem;
  font-size: clamp(1rem, 1.7vw, 1.18rem); line-height: 1.6;
  color: rgba(255, 251, 233, 0.7);
  max-width: 46ch;
}

.hero-cta-row { display: flex; flex-wrap: wrap; gap: 0.85rem; justify-content: center; margin-top: 1.9rem; }

.hero-proof {
  display: flex; align-items: center; gap: 0.6rem;
  margin-top: 1.6rem; font-size: 0.85rem; color: rgba(255, 251, 233, 0.55);
}
.hero-proof .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }

.scroll-cue {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
  padding-bottom: 0.9rem;
  color: rgba(255, 251, 233, 0.5);
  font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase;
}
.scroll-cue-line { width: 1px; height: 22px; background: linear-gradient(var(--cream), transparent); animation: scrollcue 2s var(--ease) infinite; }
@keyframes scrollcue {
  0%   { transform: scaleY(0); transform-origin: top; opacity: 0; }
  40%  { transform: scaleY(1); transform-origin: top; opacity: 1; }
  60%  { transform: scaleY(1); transform-origin: bottom; opacity: 1; }
  100% { transform: scaleY(0); transform-origin: bottom; opacity: 0; }
}

/* ---- Entrada escalonada (mesma gramatica do hero atual: opacidade + subida) ----
   As duas regras usam :not() para serem mutuamente exclusivas — nenhum
   elemento pode casar as duas ao mesmo tempo, entao nao ha disputa de
   especificidade CSS possivel entre elas. */
.js .hero:not(.is-ready) .hero-step {
  opacity: 0; transform: translateY(18px); filter: blur(8px);
  will-change: opacity, transform, filter;
}
.js .hero.is-ready .hero-step {
  opacity: 1; transform: none; filter: blur(0);
  transition: opacity 1.5s var(--ease-out), transform 1.5s var(--ease-out), filter 1.5s var(--ease-out);
}
.js .hero.is-ready .hero-step.d1 { transition-delay: .05s; }
.js .hero.is-ready .hero-step.d2 { transition-delay: .16s; }
.js .hero.is-ready .hero-step.d3 { transition-delay: .27s; }
.js .hero.is-ready .hero-step.d4 { transition-delay: .38s; }
.js .hero.is-ready .hero-step.d5 { transition-delay: .48s; }
.js .hero.is-ready .hero-step.d6 { transition-delay: .59s; }
.js .hero.is-ready .hero-step.d7 { transition-delay: .70s; }

/* ---- Revelacao ao rolar (grupos genericos) ---- */
.js .reveal:not(.is-in) { opacity: 0; transform: translateY(34px); }
.js .reveal.is-in {
  opacity: 1; transform: none;
  transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out);
}
.js .reveal.is-in.s1 { transition-delay: .07s; }
.js .reveal.is-in.s2 { transition-delay: .14s; }
.js .reveal.is-in.s3 { transition-delay: .21s; }
.js .reveal.is-in.s4 { transition-delay: .28s; }

/* ==========================================================================
   Toque / telas pequenas
   ========================================================================== */
@media (hover: none), (pointer: coarse), (max-width: 1023px) {
  .hero-mark { animation: none; }
}

/* ==========================================================================
   Movimento reduzido — mesmo catch-all do site atual
   ========================================================================== */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    transition-delay: 0s !important;
    scroll-behavior: auto !important;
  }
  .js .hero-step,
  .js .reveal { opacity: 1 !important; transform: none !important; filter: none !important; }
  .hero-bg canvas { filter: none !important; }
}

/* ==========================================================================
   TIPOGRAFIA — fora do hero (fundo claro por padrao)
   ========================================================================== */
.section { padding-block: var(--section-y); }
.section[data-theme="dark"] { background: var(--dark); }

.eyebrow {
  font-family: var(--font-body); font-weight: 600;
  font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 1.1rem;
  display: flex; align-items: center; gap: 0.65rem;
}
.eyebrow::before { content: ""; width: 24px; height: 1px; flex: none; background: var(--line-ink-strong); }
[data-theme="dark"] .eyebrow { color: var(--text-muted); }
[data-theme="dark"] .eyebrow::before { background: var(--line-strong); }

.h2 {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(1.9rem, 4.2vw, 3.1rem);
  line-height: 1.08; letter-spacing: -0.025em;
  color: var(--title);
  text-wrap: balance;
}
[data-theme="dark"] .h2 { color: var(--cream); }

.h3 {
  font-family: var(--font-display); font-weight: 600;

  'use strict';

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* ---------------- Header: estado ao rolar ---------------- */
  var header = document.getElementById('header');
  function onScroll() {
    if (header) header.classList.toggle('is-scrolled', window.scrollY > 24);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* ---------------- Menu mobile ---------------- */
  var burger = document.getElementById('burger');
  var mobileMenu = document.getElementById('mobile-menu');
  if (burger && mobileMenu) {
    burger.addEventListener('click', function () {
      var open = burger.getAttribute('aria-expanded') !== 'true';
      burger.setAttribute('aria-expanded', String(open));
      mobileMenu.setAttribute('data-open', String(open));
      document.body.classList.toggle('menu-open', open);
    });
    var menuLinks = mobileMenu.querySelectorAll('a');
    for (var i = 0; i < menuLinks.length; i++) {
      menuLinks[i].addEventListener('click', function () {
        burger.setAttribute('aria-expanded', 'false');
        mobileMenu.setAttribute('data-open', 'false');
        document.body.classList.remove('menu-open');
      });
    }
  }

  /* ---------------- Ancoras internas (#metodo, #cases...) ----------------
     Nao deixa o navegador tratar a navegacao: previne o padrao e rola a
     pagina na mao, via scrollIntoView (que respeita scroll-padding-top,
     entao o header fixo nunca cobre o alvo). Isso garante que um link como
     href="#metodo" NUNCA tente navegar para outro lugar, seja qual for o
     ambiente onde a pagina estiver sendo exibida. */
  document.addEventListener('click', function (e) {
    var link = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!link) return;
    var id = link.getAttribute('href').slice(1);
    if (!id) return;
    var target = document.getElementById(id);
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' });
    if (!target.hasAttribute('tabindex')) target.setAttribute('tabindex', '-1');
    target.focus({ preventScroll: true });
  }, false);

  /* ---------------- Entrada do hero ---------------- */
  var hero = document.getElementById('hero');
  if (hero) {
    if (reduceMotion.matches) {
      hero.classList.add('is-ready');
    } else {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { hero.classList.add('is-ready'); });
      });
    }
  }

  /* ==========================================================================
     Revelacao ao rolar (.reveal e .reveal-lines -> .is-in) — fade + subida
     conforme o titulo/elemento entra na tela. Tres gatilhos independentes
     apontam para a mesma checagem de posicao (scroll/resize com rAF, um
     polling por timer e o IntersectionObserver quando disponivel): se por
     qualquer motivo um deles nao disparar no ambiente onde a pagina estiver
     rodando, os outros garantem que a revelacao aconteca do mesmo jeito.
     check() e idempotente — chamar de novo em cima do que ja revelou nao faz
     nada, entao a redundancia sai barata.
     ========================================================================== */
  (function () {
    var els = document.querySelectorAll('.reveal, .reveal-lines');
    if (!els.length) return;
    if (reduceMotion.matches) {
      for (var i = 0; i < els.length; i++) { els[i].classList.add('is-in'); }
      return;
    }
    var pending = Array.prototype.slice.call(els);

    function stopAll() {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
      if (poller) clearInterval(poller);
      if (io) io.disconnect();
    }

    function check() {
      if (!pending.length) return;
      var vh = window.innerHeight || document.documentElement.clientHeight;
      var next = [];
      for (var i = 0; i < pending.length; i++) {
        var el = pending[i];
        var rect = el.getBoundingClientRect();
        if (rect.top < vh * 0.92 && rect.bottom > 0) {
          el.classList.add('is-in');
        } else {
          next.push(el);
        }
      }
      pending = next;
      if (!pending.length) stopAll();
    }

    var ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () { check(); ticking = false; });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });

    /* Rede de seguranca: reavalia por conta propria, sem depender de nenhum
       evento de scroll ter disparado. */
    var poller = setInterval(check, 300);

    var io = null;
    if ('IntersectionObserver' in window) {
      io = new IntersectionObserver(function (entries) {
        for (var e = 0; e < entries.length; e++) {
          if (entries[e].isIntersecting) entries[e].target.classList.add('is-in');
        }
        check(); /* sincroniza a lista `pending` com o que o observer ja revelou */
      }, { threshold: 0.01, rootMargin: '0px 0px -8% 0px' });
      for (var o = 0; o < pending.length; o++) io.observe(pending[o]);
    }

    check(); /* estado inicial, sem esperar o primeiro scroll */
  })();

  /* ---------------- Paralaxe sutil do hero ao rolar ----------------
     So mexe em .hero-bg e .hero-content (o wrapper, nao os .hero-step
     filhos) para nao brigar com a transicao CSS da entrada. */
  var heroBg = document.querySelector('.hero-bg');
  var heroContent = document.querySelector('.hero-content');
  if (hero && heroBg && !reduceMotion.matches) {
    var ticking = false;
    var updateParallax = function () {
      var rect = hero.getBoundingClientRect();
      var progress = Math.min(Math.max(-rect.top / rect.height, 0), 1);
      heroBg.style.transform = 'translate3d(0,' + (progress * 46).toFixed(1) + 'px,0)';
      heroBg.style.opacity = String(1 - progress * 0.4);
      if (heroContent) {
        heroContent.style.transform = 'translate3d(0,' + (progress * 26).toFixed(1) + 'px,0)';
        heroContent.style.opacity = String(Math.max(0, 1 - progress * 1.1));
      }
      ticking = false;
    };
    window.addEventListener('scroll', function () {
      if (!ticking) { requestAnimationFrame(updateParallax); ticking = true; }
    }, { passive: true });
    updateParallax();
  }

  /* ==========================================================================
     Fundo animado do hero — ruido simplex em WebGL (portado do componente
     Velaris para JS puro; este projeto e HTML/CSS/JS estatico, sem React
     nem build step, entao o shader GLSL foi preservado e o wrapper reescrito
     em vanilla). Sem WebGL, sem JS ou com movimento reduzido, o gradiente
     CSS de .hero (#161616 -> #282828) permanece visivel sozinho.
     ========================================================================== */
  function initHeroShader() {
    var canvas = document.getElementById('hero-shader');
    if (!canvas || reduceMotion.matches) return;

    var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!gl) return;

    var vertexSrc = [
      'attribute vec2 position;',
      'varying vec2 vUv;',
      'void main() {',
      '  vUv = position * 0.5 + 0.5;',
      '  gl_Position = vec4(position, 0.0, 1.0);',
      '}'
    ].join('\n');

    var fragmentSrc = [
      'precision highp float;',
      'varying vec2 vUv;',
      '',
      'uniform vec2  u_resolution;',
      'uniform float u_time;',
      'uniform float u_grain;',
      'uniform vec3  u_colors[4];',
      'uniform vec3  u_bg;',
      '',
      'vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }',
      '',
      'float snoise(vec2 v){',
      '  const vec4 C = vec4(0.211324865405187, 0.366025403784439,',
      '           -0.577350269189626, 0.024390243902439);',
      '  vec2 i  = floor(v + dot(v, C.yy) );',
      '  vec2 x0 = v -   i + dot(i, C.xx);',
      '  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);',
      '  vec4 x12 = x0.xyxy + C.xxzz;',
      '  x12.xy -= i1;',
      '  i = mod(i, 289.0);',
      '  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))',
      '  + i.x + vec3(0.0, i1.x, 1.0 ));',
      '  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),',
      '    dot(x12.zw,x12.zw)), 0.0);',
      '  m = m*m ;',
      '  m = m*m ;',
      '  vec3 x = 2.0 * fract(p * C.www) - 1.0;',
      '  vec3 h = abs(x) - 0.5;',
      '  vec3 ox = floor(x + 0.5);',
      '  vec3 a0 = x - ox;',
      '  m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );',
      '  vec3 g;',
      '  g.x  = a0.x  * x0.x  + h.x  * x0.y;',
      '  g.yz = a0.yz * x12.xz + h.yz * x12.yw;',
      '  return 130.0 * dot(m, g);',
      '}',
      '',
      'void main() {',
      '  vec2 uv = vUv;',
      '  float ratio = u_resolution.x / u_resolution.y;',
      '  vec2 p = uv - 0.5;',
      '  p.x *= ratio;',
      '',
      '  float t = u_time * 0.1;',
      '',
      '  float n1 = snoise(p * 0.65 + vec2(t * 0.32, -t * 0.48));',
      '  float n2 = snoise(p * 0.85 + vec2(-t * 0.24, t * 0.4) + n1 * 0.3);',
      '  float n3 = snoise(p * 1.15 + vec2(t * 0.16, -t * 0.32) + n2 * 0.25);',
      '',
      '  vec3 col = u_bg;',
      '',
      '  float dist = length(p) * 1.5;',
      '  float vignette = 1.0 - smoothstep(0.25, 1.35, dist);',
      '',
      '  col = mix(col, u_colors[0], smoothstep(-0.05, 0.3, n1) * 0.9);',
      '  col = mix(col, u_colors[1], smoothstep(0.0, 0.35, n2) * 0.75);',
      '  col = mix(col, u_colors[2], smoothstep(-0.1, 0.25, n3) * 0.65);',
      '  col = mix(col, u_colors[3], smoothstep(0.0, 0.4, n1 * n2) * 0.55);',
      '',
      '  float glow = smoothstep(0.85, 0.0, dist) * 0.4;',
      '  col += u_colors[1] * glow;',
      '',
      '  col = mix(col * 0.4, col, vignette);',
      '',
      '  float grain = fract(sin(dot(uv, vec2(12.9898, 78.233))) * 43758.5453 + u_time);',
      '  col += (grain - 0.5) * u_grain * 0.1;',
      '',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n');

    function compile(type, src) {
      var shader = gl.createShader(type);
      gl.shaderSource(shader, src);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.warn('[hero-shader] erro ao compilar shader:', gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    var vs = compile(gl.VERTEX_SHADER, vertexSrc);
    var fs = compile(gl.FRAGMENT_SHADER, fragmentSrc);
    if (!vs || !fs) return;

    var program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.warn('[hero-shader] erro ao linkar programa:', gl.getProgramInfoLog(program));
      return;
    }
    gl.useProgram(program);

    var buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    var posLoc = gl.getAttribLocation(program, 'position');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    var locs = {
      res: gl.getUniformLocation(program, 'u_resolution'),
      time: gl.getUniformLocation(program, 'u_time'),
      grain: gl.getUniformLocation(program, 'u_grain'),
      colors: gl.getUniformLocation(program, 'u_colors'),
      bg: gl.getUniformLocation(program, 'u_bg')
    };

    function hexToRgb(hex) {
      var h = hex.replace('#', '');
      return [
        parseInt(h.substr(0, 2), 16) / 255,
        parseInt(h.substr(2, 2), 16) / 255,
        parseInt(h.substr(4, 2), 16) / 255
      ];
    }

    /* Paleta presa a #161616 -> #282828, como pedido: sem cores novas, so
       variacoes de cinza-chumbo + um toque de cromado frio mais presente
       (colors[3]) para o movimento ficar visivel, nao só um borrão parado. */
    var bg = hexToRgb('#141414');
    var paletteHex = ['#2c2c2c', '#1c1c1c', '#262626', '#55555c'];
    var flatColors = new Float32Array(paletteHex.reduce(function (acc, hex) {
      return acc.concat(hexToRgb(hex));
    }, []));

    var speed = 1.6;   /* movimento perceptivel, ainda sem competir com o texto */
    var grain = 0.24;  /* mais textura de metal escovado, menos "borrado" */

    var container = canvas.parentElement;

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = container.clientWidth || 1;
      var h = container.clientHeight || 1;
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();

    var ro = null;
    if ('ResizeObserver' in window) {
      ro = new ResizeObserver(resize);
      ro.observe(container);
    } else {
      window.addEventListener('resize', resize, { passive: true });
    }

    var raf = null;
    var running = true;

    function render(t) {
      if (!running) return;
      gl.uniform2f(locs.res, canvas.width, canvas.height);
      gl.uniform1f(locs.time, t * 0.001 * speed);
      gl.uniform1f(locs.grain, grain);
      gl.uniform3f(locs.bg, bg[0], bg[1], bg[2]);
      gl.uniform3fv(locs.colors, flatColors);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      raf = requestAnimationFrame(render);
    }
    raf = requestAnimationFrame(render);

    /* Pausa o loop com a aba escondida: nada de gastar GPU/bateria a toa. */
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        running = false;
        if (raf) cancelAnimationFrame(raf);
      } else if (!running && !reduceMotion.matches) {
        running = true;
        raf = requestAnimationFrame(render);
      }
    });

    canvas.classList.add('is-ready');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initHeroShader);
  } else {
    initHeroShader();
  }

  /* ==========================================================================
     Método — atenua as etapas vizinhas no hover (so com ponteiro fino)
     ========================================================================== */
  (function () {
    var lista = document.querySelector('.steps');
    if (!lista || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    var itens = lista.querySelectorAll('.step');

    lista.addEventListener('mouseleave', function () {
      lista.classList.remove('is-hovered');
      for (var i = 0; i < itens.length; i++) { itens[i].classList.remove('is-active'); }
    });
    for (var i = 0; i < itens.length; i++) {
      (function (item) {
        item.addEventListener('mouseenter', function () {
          lista.classList.add('is-hovered');
          for (var j = 0; j < itens.length; j++) { itens[j].classList.remove('is-active'); }
          item.classList.add('is-active');
        });
      })(itens[i]);
    }
  })();

  /* ==========================================================================
     FAQ — acordeao acessivel. Painel some com hidden quando fechado; altura
     anima so com movimento permitido. O timeout em onceSettled cobre o caso
     de transitionend nao disparar com a aba em segundo plano (confirmado
     nesta sessao: um dos bugs que corrigimos no hero era exatamente isso).
     ========================================================================== */
  (function () {
    var questions = document.querySelectorAll('.faq-q');
    if (!questions.length) return;
    var FAQ_MS = 340;

    function onceSettled(panel, finish) {
      var settled = false;
      var run = function () {
        if (settled) return;
        settled = true;
        panel.removeEventListener('transitionend', run);
        clearTimeout(timer);
        finish();
      };
      var timer = setTimeout(run, FAQ_MS + 60);
      panel.addEventListener('transitionend', run);
    }

    function closePanel(btn, panel, animate) {
      btn.setAttribute('aria-expanded', 'false');
      if (!animate) { panel.style.height = ''; panel.hidden = true; return; }
      panel.style.height = panel.scrollHeight + 'px';
      void panel.offsetHeight;
      panel.style.height = '0px';
      onceSettled(panel, function () { panel.hidden = true; panel.style.height = ''; });
    }

    function openPanel(btn, panel, animate) {
      btn.setAttribute('aria-expanded', 'true');
      panel.hidden = false;
      if (!animate) { panel.style.height = 'auto'; return; }
      panel.style.height = '0px';
      void panel.offsetHeight;
      panel.style.height = panel.scrollHeight + 'px';
      onceSettled(panel, function () { panel.style.height = 'auto'; });
    }

    for (var q = 0; q < questions.length; q++) {
      questions[q].addEventListener('click', function () {
        var panel = document.getElementById(this.getAttribute('aria-controls'));
        if (!panel) return;
        var animate = !reduceMotion.matches;
        if (this.getAttribute('aria-expanded') === 'true') { closePanel(this, panel, animate); }
        else { openPanel(this, panel, animate); }
      });
    }
  })();

  /* ==========================================================================
     CURSOR POLIGONAL — ponto preciso + contorno em losango com atraso
     elastico. O poligono e uma leitura minimalista do simbolo da marca, nao
     uma copia. Posicao escrita em CSS variables dentro de um unico rAF.
     So ativa com ponteiro fino em telas grandes; nunca em toque.
     ========================================================================== */
  (function () {
    var fino = window.matchMedia('(hover: hover) and (pointer: fine)');
    if (!fino.matches || reduceMotion.matches) return;

    var dot = document.createElement('div');
    dot.className = 'cursor-dot';
    dot.setAttribute('aria-hidden', 'true');

    var poly = document.createElement('div');
    poly.className = 'cursor-poly';
    poly.setAttribute('aria-hidden', 'true');
    poly.setAttribute('data-state', 'quiet');
    poly.innerHTML =
      '<svg viewBox="0 0 34 52" fill="none" aria-hidden="true">' +
        '<polygon points="17,1 33,26 17,51 1,26" />' +
      '</svg>' +
      '<span class="cursor-label"></span>';

    var label = poly.querySelector('.cursor-label');
    document.body.appendChild(dot);
    document.body.appendChild(poly);

    var alvoX = window.innerWidth / 2, alvoY = window.innerHeight / 2;
    var polyX = alvoX, polyY = alvoY;
    var escala = 1, escalaAlvo = 1, ativo = false;

    window.addEventListener('pointermove', function (e) {
      alvoX = e.clientX; alvoY = e.clientY;
      if (!ativo) { ativo = true; polyX = alvoX; polyY = alvoY; }
      document.body.classList.add('cursor-ready');

      /* Fundo claro ou escuro embaixo do ponteiro: troca a cor do cursor.
         elementFromPoint e barato o bastante para rodar a cada movimento
         (o navegador ja faz esse hit-test para eventos de ponteiro). */
      var under = document.elementFromPoint(e.clientX, e.clientY);
      var onDark = !!(under && under.closest && under.closest('[data-theme="dark"]'));
      document.body.classList.toggle('cursor-on-dark', onDark);
    }, { passive: true });

    document.addEventListener('pointerleave', function () { document.body.classList.remove('cursor-ready'); });
    document.addEventListener('pointerenter', function () {
      if (ativo) { document.body.classList.add('cursor-ready'); }
    });

    var ESCALAS = { default: 1, quiet: 0.85, link: 1.2, cta: 1.65, case: 1.75, media: 1.35 };

    function definirEstado(el) {
      var alvo = el && el.closest ? el.closest('[data-cursor]') : null;
      var estado = alvo ? (alvo.getAttribute('data-cursor') || 'quiet') : 'quiet';
      if (poly.getAttribute('data-state') !== estado) {
        poly.setAttribute('data-state', estado);
        var txt = alvo ? (alvo.getAttribute('data-cursor-label') || '') : '';
        label.textContent = txt;
      }
      escalaAlvo = ESCALAS[estado] || 1;
    }

    document.addEventListener('pointerover', function (e) { definirEstado(e.target); }, { passive: true });
    document.addEventListener('pointerout', function (e) {
      if (!e.relatedTarget) definirEstado(null);
    }, { passive: true });

    document.addEventListener('pointerdown', function () { dot.style.setProperty('--dot-s', '0.6'); });
    document.addEventListener('pointerup', function () { dot.style.setProperty('--dot-s', '1'); });

    var girando = 0;
    (function loop() {
      polyX += (alvoX - polyX) * 0.14;
      polyY += (alvoY - polyY) * 0.14;
      escala += (escalaAlvo - escala) * 0.16;
      girando += (alvoX - polyX) * 0.02;
      girando *= 0.92;

      dot.style.setProperty('--dot-x', alvoX + 'px');
      dot.style.setProperty('--dot-y', alvoY + 'px');
      poly.style.setProperty('--poly-x', polyX.toFixed(2) + 'px');
      poly.style.setProperty('--poly-y', polyY.toFixed(2) + 'px');
      poly.style.setProperty('--poly-s', escala.toFixed(3));
      poly.style.setProperty('--poly-r', girando.toFixed(2) + 'deg');

      requestAnimationFrame(loop);
    })();
  })();
})();

</script>
